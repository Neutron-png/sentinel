[package]
name = "sentinel"
version = "0.1.0"
edition = "2021"
description = "A professional web application security assessment workflow tool"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", features = ["cookies", "gzip", "brotli", "deflate", "http2", "rustls-tls", "json"], default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rcgen = "0.13"
pem = "3"
rustls-pemfile = "2"
url = "2"
