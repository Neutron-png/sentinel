[package]
name = "sentinel-desktop"
version = "0.1.0"
edition = "2021"
description = "Sentinel desktop GUI (Tauri) over the sentinel engine"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = "0.4"
tokio = { version = "1", features = ["sync"] }
url = "2"
sentinel = { path = ".." }

[profile.release]
strip = true
lto = true
